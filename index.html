    <script>
      // Gracefully catch Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event && event.reason && (event.reason.message || event.reason.toString())) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1) {
          event.preventDefault();
          if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1) {
          event.preventDefault();
          if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
        }
      });
    </script>

  </body>
